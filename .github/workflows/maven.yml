name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: sanity-check
      run: |
        $env:PROCESSOR_ARCHITECTURE
        java -version

    - name: Formatting
      run: mvn spotless:check

    - name: Build with Maven
      run: mvn package
